[workspace]
resolver = "2"
members = [
    "crates/tick-math",
    "crates/margin-sim",
    "crates/settlement-ledger",
    "crates/oms-core",
    "crates/curve-engine",
    "crates/quoting-engine",
    "crates/risk-engine",
    "crates/arb-engine",
    "execution-adapter/rust-bridge",
    "crates/feed-ingest",
    "services/risk-monitor",
    "services/mm-bot",
    "services/arb-bot",
    "tools/backtester",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT"
rust-version = "1.85"

[workspace.dependencies]
thiserror          = "1"
anyhow             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio              = { version = "1", features = ["full"] }
tokio-tungstenite  = "0.21"
futures-util       = { version = "0.3", features = ["sink"] }
async-trait        = "0.1"
reqwest            = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug    = true
